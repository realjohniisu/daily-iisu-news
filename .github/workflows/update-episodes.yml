name: Update Daily iiSU News Episodes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-episodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update episodes
        run: python update_episodes.py

      - name: Show generated database
        run: |
          echo "========================================"
          echo "GENERATED EPISODES.JSON"
          echo "========================================"
          cat episodes.json
          echo "========================================"

      - name: Upload database for debugging
        uses: actions/upload-artifact@v4
        with:
          name: episodes-debug
          path: episodes.json

      - name: Check for changes
        id: changes
        run: |
          git add episodes.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to episodes.json"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "episodes.json has changed"
          fi

      - name: Commit updated database
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update episode list"
          git push
